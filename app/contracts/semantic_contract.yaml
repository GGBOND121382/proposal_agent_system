  SC-ARGUMENT-STATE-OWNERSHIP:
    responsibility: DETERMINISTIC_GUARD
    category: ARGUMENT_META
    blocking: true
    description: Define the sole authored semantic state, pure runtime projections,
      independent defect namespaces and transactional repair boundary.
    config:
      authoritative_root: result/authored_state
      projection_version: ARGUMENT_PROJECTOR_V2
      overlap_policy: COEXIST
      repair_mode: AUTHORITATIVE_STATE_TRANSACTION
      field_writers:
        result/authored_state: ARGUMENT_STATE_COMMITTER
        result/argument_architecture: ARGUMENT_PROJECTOR
        result/research_design_matrix: ARGUMENT_PROJECTOR
        result/evidence_gap_report: ARGUMENT_PROJECTOR
