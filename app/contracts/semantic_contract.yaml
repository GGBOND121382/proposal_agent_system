version: 2.4.1
rule_registry_version: 1.3.0
rules:
  SC-ARGUMENT-ROLE-COMPATIBILITY:
    responsibility: DETERMINISTIC_GUARD
    category: ARGUMENT_ROLE
    blocking: true
    description: Canonicalize argument roles and decide whether an actual role satisfies a required role.
    config:
      finding_locator_strategy: COLLECTION_SCOPE_WHEN_MISSING
      canonical:
      - CONTEXT
      - PROBLEM
      - EVIDENCE
      - GAP
      - LIMITATION_MECHANISM
      - CENTRAL_CLAIM
      - RESEARCH_QUESTION
      - METHOD
      - WARRANT
      - COUNTERARGUMENT
      - BOUNDARY
      - EVALUATION
      - CONTRIBUTION
      - TRANSITION
      aliases:
        BACKGROUND_POSITIONING: CONTEXT
        BACKGROUND_ANALYSIS: CONTEXT
        PROBLEM_SUMMARY: PROBLEM
        GAP_IDENTIFICATION: GAP
        METHOD_COMMITMENT: METHOD
        METHOD_DESCRIPTION: METHOD
        EXPECTED_CONTRIBUTION: CONTRIBUTION
        CASE_ANALYSIS: CONTEXT
        PRIOR_WORK_SURVEY: EVIDENCE
        GAP_FORMATION: WARRANT
        MOTIVATION_ARGUMENT: WARRANT
        CENTRAL_STATEMENT: CENTRAL_CLAIM
        CENTRAL_PROPOSITION: CENTRAL_CLAIM
        GAP_TO_RQ_MAPPING: RESEARCH_QUESTION
        RESEARCH_QUESTIONS: RESEARCH_QUESTION
        DIFFICULTY_EXPLANATION: LIMITATION_MECHANISM
        OBJECTIVE_MAPPING: CENTRAL_CLAIM
        SUCCESS_DEFINITION: EVALUATION
        PROPOSITION_CONNECTION: WARRANT
        RESEARCH_OBJECT_DEFINITION: CONTEXT
        MECHANISM_OUTLINE: METHOD
        INTERMEDIATE_OUTPUT: CONTRIBUTION
        TASK_DEPENDENCY: WARRANT
        TECHNICAL_ROUTE: METHOD
        ARCHITECTURE_LAYERS: METHOD
        VERIFICATION_EXECUTION: EVALUATION
        EXPERIMENT_DESIGN: EVALUATION
        SYSTEM_CONSTRAINTS: BOUNDARY
        CONSTRAINT_SPECIFICATION: BOUNDARY
        BOUNDARY_CONDITIONS: BOUNDARY
        BASELINE_COMPARISON: EVIDENCE
        NOVEL_MECHANISM: CENTRAL_CLAIM
        EXPECTED_IMPROVEMENT: CONTRIBUTION
        APPLICABLE_CONDITIONS: BOUNDARY
        SCENARIO_DEFINITION: CONTEXT
        CONTROL_GROUPS: EVALUATION
        PERTURBATION_SET: EVALUATION
        BASELINE_PROCEDURE: METHOD
        METRIC_DIMENSIONS: EVALUATION
        UNKNOWN_DECLARATION: BOUNDARY
        UNKNOWN_INVENTORY: EVIDENCE
        IMPACT_ASSESSMENT: LIMITATION_MECHANISM
        MITIGATION_STRATEGY: METHOD
        REVISED_PLAN: CONTRIBUTION
        PHASE_PLAN: METHOD
        RISK_IDENTIFICATION: COUNTERARGUMENT
        RISK_CONTROL: WARRANT
        EXPECTED_DELIVERABLES: CONTRIBUTION
        DELIVERY_FORM: CONTRIBUTION
        CENTRAL_RECAP: CENTRAL_CLAIM
        RQ_COMMITMENT: RESEARCH_QUESTION
        CONTRIBUTION_STATEMENT: CONTRIBUTION
      compatibility:
        PROBLEM:
        - PROBLEM
        - RESEARCH_QUESTION
        RESEARCH_QUESTION:
        - RESEARCH_QUESTION
        - PROBLEM
  SC-INFORMATION-KEY-HIERARCHY:
    responsibility: DETERMINISTIC_GUARD
    category: INFORMATION_KEY
    blocking: true
    description: Decide whether an information key is an approved root or an approved hierarchical child.
    config:
      finding_locator_strategy: PER_INSTANCE_EXISTING_FIELD
      hierarchy_separator: ':'
      exact_root_is_valid: true
      child_keys_are_valid: true
      legacy_dash_children: false
  SC-CLAIM-COVERAGE:
    responsibility: DETERMINISTIC_GUARD
    category: CLAIM_COVERAGE
    blocking: true
    description: Compute covered claims from the union of all registered claim-bearing blueprint fields.
    config:
      finding_locator_strategy: COLLECTION_SCOPE_WHEN_MISSING
      fields:
      - primary_claim_id
      - project_item_slots
      - technical_slots
      primary_claim_required_roles:
      - CENTRAL_CLAIM
      - RESEARCH_QUESTION
  SC-EVIDENCE-SELF-REFERENCE:
    responsibility: DETERMINISTIC_GUARD
    category: EVIDENCE_EXCLUSION
    blocking: true
    description: Compute evidence identifiers and reject a primary claim used as its own evidence.
    config:
      finding_locator_strategy: PER_INSTANCE_EXISTING_FIELD
      evidence_fields:
      - required_evidence_ids
      - fact_slots
      - metric_slots
      forbid_self_evidence: true
  SC-EVIDENCE-CONTRACT-COVERAGE:
    responsibility: DETERMINISTIC_GUARD
    category: EVIDENCE_COVERAGE
    blocking: true
    description: Require every evidence identifier mandated by the section contract to be bound by the blueprint.
    config:
      finding_locator_strategy: COLLECTION_SCOPE_WHEN_MISSING
      contract_field: must_use_evidence_ids
  SC-REFERENCE-FIELD-SEMANTICS:
    responsibility: OUTPUT_INTEGRITY
    category: REFERENCE_FIELD
    blocking: true
    description: Classify every identifier-like schema field so validation and normalization share one
      meaning; entity field paths must be anchored by an exact visible entity ID and bare property names
      are never references.
    config:
      input_object_fields:
      - required_input_ids
      - evidence_refs
      registered_suffix_aliases:
        unresolved_slot_ids:
        - UNKNOWN
        - ABSENT-FACT
      path_overrides:
        P-SECURITY-CLASSIFY:
          ENTITY_REF:
          - result/object_id
        P-ARGUMENT-ARCHITECTURE:
          ENTITY_REF:
          - result/research_design_matrix/*/research_question_id
          - result/argument_architecture/edges/*/source_id
          - result/argument_architecture/edges/*/target_id
        P-ARGUMENT-ARCHITECTURE-CRITIC:
          ENTITY_REF:
          - result/design_matrix_checks/*/research_question_id
          - result/evidence_checks/*/node_id
        P-SCHEME-CRITIC:
          ENTITY_REF:
          - result/numeric_checks/*/rule_id
          SOURCE_REF:
          - result/missing_rule_candidates/*/source_ref/source_id
        P-PROJECT-DEFINITION-EXTRACT:
          ENTITY_REF:
          - result/project_definition/relations/*/source_item_id
          - result/project_definition/relations/*/target_item_id
          - result/argument_graph_seed/edges/*/source_id
          - result/argument_graph_seed/edges/*/target_id
        P-PROJECT-READINESS-CRITIC:
          PROTOCOL_REF:
          - result/chapter_readiness/*/profile_id
        P-FACT-EXTRACT:
          ENTITY_REF:
          - result/coverage/*/span_id
        P-TEMPLATE-EXTRACT:
          ENTITY_REF:
          - result/coverage/*/section_id
        P-FINAL-CONFIDENTIALITY-REVIEW:
          ENTITY_REF:
          - result/sensitive_spans/*/section_id
        P-REVISION-PLAN:
          ENTITY_REF:
          - result/revision_plan/dependencies/*/predecessor_task_id
          - result/revision_plan/dependencies/*/successor_task_id
          - result/revision_plan/narrative_architecture/central_proposition_id
          - result/revision_plan/narrative_architecture/section_contracts/*/section_id
          - result/readiness_summary/*/task_id
          PROTOCOL_REF:
          - result/revision_plan/narrative_architecture/section_contracts/*/profile_id
        P-WRITE-BLUEPRINT:
          ENTITY_REF:
          - result/blueprint/section_profile_id
          - result/blueprint/section_contract_id
          - result/plan_task_coverage/*/revision_task_id
          - result/input_usage_summary/*/source_id
        P-WRITE-CONTENT:
          ENTITY_REF:
          - result/paragraphs/*/section_contract_id
          - result/trace_links/*/source_id
          - result/source_preservation_summary/*/paragraph_id
          - result/claim_advancement/section_contract_id
        P-WRITE-CRITIC:
          ENTITY_REF:
          - result/paragraph_reviews/*/paragraph_id
        P-EXPRESSION-POLISH:
          ENTITY_REF:
          - result/candidate_id
          - result/paragraphs/*/paragraph_id
          - result/paragraphs/*/section_contract_id
          - result/trace_links/*/trace_id
          - result/trace_links/*/source_id
          - result/source_preservation_summary/*/paragraph_id
          - result/edit_log/*/paragraph_id
          - result/claim_advancement/section_contract_id
        P-INTEGRATION-CRITIC:
          ENTITY_REF:
          - result/mapping_checks/*/source_id
          - result/central_proposition_coverage/central_proposition_id
        P-SCHEME-EXTRACT:
          SOURCE_REF:
          - result/extraction_coverage/*/source_id
        P-PUBLIC-RESEARCH-CRITIC:
          SOURCE_REF:
          - result/source_quality_summary/*/source_id
