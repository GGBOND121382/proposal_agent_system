      decision_arbiter_mode: AUDIT_ONLY
  SC-ARGUMENT-LIFECYCLE-COMPOSITION:
    responsibility: DETERMINISTIC_GUARD
    category: ARGUMENT_META
    blocking: true
    description: Declare the exact runtime shape at every Producer, Critic, Repair, persistence and rereview handoff.
    config:
      producer_prompt: P-ARGUMENT-ARCHITECTURE
      shapes:
        producer_persisted_output: PRODUCER_PROTOCOL_OUTPUT
        producer_consumer_value: PRODUCER_RESULT
        critic_architecture_candidate: PRODUCER_RESULT
        targeted_repair_original_content: PRODUCER_RESULT
        repair_application_value: PRODUCER_RESULT
        repair_canonical_output: PRODUCER_PROTOCOL_OUTPUT
        authoritative_state: AUTHORED_STATE
        argument_graph_consumer: ARGUMENT_GRAPH
      transitions:
        PRODUCER_PERSIST_TO_CONTEXT:
          writer_shape: PRODUCER_PROTOCOL_OUTPUT
          reader_shape: PRODUCER_RESULT
          adapter: OUTPUT_RESULT
        CONTEXT_TO_CRITIC:
          writer_shape: PRODUCER_RESULT
          reader_shape: PRODUCER_RESULT
          adapter: AUTHORITATIVE_REPROJECT
        CRITIC_TO_TARGETED_REPAIR:
          writer_shape: PRODUCER_RESULT
          reader_shape: PRODUCER_RESULT
          adapter: IDENTITY
        TARGETED_REPAIR_TO_PROJECTOR:
          writer_shape: PRODUCER_RESULT
          reader_shape: AUTHORED_STATE
          adapter: RESULT_AUTHORED_STATE
        PROJECTOR_TO_REPAIR_APPLICATION:
          writer_shape: PRODUCER_PROTOCOL_OUTPUT
          reader_shape: PRODUCER_RESULT
          adapter: OUTPUT_RESULT
        REPAIR_APPLICATION_TO_CONTEXT:
          writer_shape: PRODUCER_RESULT
          reader_shape: PRODUCER_RESULT
          adapter: ACTIVE_REPAIR_VALUE
        CONTEXT_TO_CRITIC_REREVIEW:
          writer_shape: PRODUCER_RESULT
          reader_shape: PRODUCER_RESULT
          adapter: AUTHORITATIVE_REPROJECT
        CONTEXT_TO_DOWNSTREAM:
          writer_shape: PRODUCER_RESULT
          reader_shape: PRODUCER_RESULT
          adapter: AUTHORITATIVE_REPROJECT
        CONTEXT_TO_WF3_RESEARCH:
          writer_shape: PRODUCER_RESULT
          reader_shape: ARGUMENT_GRAPH
          adapter: AUTHORITATIVE_REPROJECT_ARGUMENT_GRAPH
      lifecycle_rules:
        repair_commit_and_rereview_checkpoint: ATOMIC
        original_producer_regeneration: SUPERSEDES_ACTIVE_REPAIR
        integration_argument_regeneration: SUPERSEDES_ACTIVE_REPAIR
        human_input_rereview: PRESERVES_ACTIVE_REPAIR
        prerequisite_source_scope: TRANSITIVE_FROZEN_CLOSURE
        post_projection_contract_failure: REGENERATE_OR_RUNTIME_FAIL_NO_LLM_ENVELOPE_REPAIR
  SC-ARGUMENT-TARGETED-REPAIR-POLICY:
    responsibility: DETERMINISTIC_GUARD
    category: ARGUMENT_REPAIR
    blocking: true
    description: Define Argument Architecture local-repair write permissions and machine-managed
      fields from one policy.
    config:
      # Targeted Repair receives the ProducerResult consumer value, not the
      # outer Producer protocol envelope.  The persisted source-of-truth path is
      # result/authored_state; inside repair content that same state is /authored_state.
      authoritative_root: /authored_state
      editable_fields:
      - statement
      - proposition_type
      - falsifiable_or_comparable
      - boundary_conditions
      - question_type
      - answerability
      - success_evidence
      - in_scope
      - out_of_scope
      - falsification_or_comparison_rule
      machine_fields:
      - node_id
      - node_type
      - status
      - source_refs
      - graph_id
      - edge_id
      - source_id
      - target_id
      - relation
      - relation_id
      - object_id
      - object_type
      - finding_instance_id
      - target_path_or_span
      machine_suffixes:
      - _hash
      - _ids
      - _id
      local_context_max_depth: 3
      local_context_max_items: 8
      reference_node_types:
        gap_ids: RESEARCH_GAP
        objective_ids: OBJECTIVE
        work_package_ids: WORK_PACKAGE
        method_ids: METHOD
        evaluation_ids: EXPERIMENT_DESIGN
        innovation_ids: NOVEL_MECHANISM
        foundation_evidence_ids: TEAM_EVIDENCE
        closest_prior_work_ids: CLOSEST_PRIOR_WORK
  SC-REFERENCE-FIELD-SEMANTICS:
    responsibility: OUTPUT_INTEGRITY
    category: REFERENCE_FIELD
    blocking: true
    description: Classify every identifier-like schema field so validation and normalization
      share one meaning; entity field paths must be anchored by an exact visible entity
      ID and bare property names are never references.
