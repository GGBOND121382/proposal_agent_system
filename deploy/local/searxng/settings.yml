use_default_settings: true

general:
  debug: false
  instance_name: "Proposal Agent local SearXNG"

search:
  safe_search: 1
  formats:
    - html
    - json

server:
  # This value is overridden by SEARXNG_SECRET when the startup script creates
  # the loopback-only container.
  secret_key: "overridden-by-SEARXNG_SECRET"
  limiter: false
  image_proxy: false

outgoing:
  request_timeout: 10.0
  max_request_timeout: 30.0

engines:
  # China-routed IPs are 302-redirected from www.bing.com to cn.bing.com and
  # SearXNG engine requests do not follow that redirect, which silently yields
  # zero results.  Point bing at cn.bing.com directly.  Chinese queries should
  # be routed here with language=zh-CN (PUBLIC_SEARCH_ENGINES_ZH=bing).
  - name: bing
    disabled: false
    timeout: 10.0
    base_url: https://cn.bing.com

  # stract/mwmbl are the only English-capable engines reachable from the local
  # network (small indexes, sparse coverage).  English queries are routed to
  # them via PUBLIC_SEARCH_ENGINES_EN=stract,mwmbl.
  - name: stract
    disabled: false
    timeout: 12.0

  - name: mwmbl
    disabled: false
    timeout: 12.0

  # Verified broken from the local network: captcha (baidu/sogou), engine crash
  # (quark), silent empty results (360search), unreachable/timeout
  # (brave/duckduckgo/startpage).
  - name: 360search
    disabled: true

  - name: baidu
    disabled: true

  - name: quark
    disabled: true

  - name: sogou
    disabled: true

  - name: brave
    disabled: true

  - name: duckduckgo
    disabled: true

  - name: startpage
    disabled: true
